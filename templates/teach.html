{% extends "base.html" %}
{% block title %}Teach — Hanzi Friend{% endblock %}
{% block content %}
<article>
  <h1>Teach a word</h1>
  <p>
    Add a word you met in the wild. It gets cards right away and joins
    the review rotation.
  </p>
  <form method="POST" action="/teach">
    <label for="word-learn">Word (汉字)</label>
    <input type="text" id="word-learn" name="word" required />
    <button type="submit">Learn word</button>
  </form>
</article>
{% endblock %}

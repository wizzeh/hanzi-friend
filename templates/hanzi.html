{% extends "base.html" %}
{% block head %}
<script type="text/javascript">
  // play() rejects if the audio element is swapped out mid-play
  // (e.g. answering quickly); that interruption is fine to ignore.
  const play = (id) => {
    document.getElementById(id).play().catch(() => {})
  }
  const play_success = () => play("success-audio")
  const play_failure = () => play("failure-audio")
  const play_pronounce = () => play("pronounce")
  // Accept any of the pronunciations the dictionary lists, with or
  // without spaces between syllables, and with ü typed as v or u:.
  // On window because hyperscript resolves bare names via window[...],
  // which can't see top-level consts.
  window.check_pronunciation = (value) => {
    const answers = JSON.parse(
      document.getElementById("pronunciation-answers").textContent
    )
    const normalize = (pinyin) =>
      pinyin
        .trim()
        .toLowerCase()
        .replaceAll("u:", "v")
        .replaceAll("ü", "v")
        .replace(/\s+/g, "")
    return answers.some((answer) => normalize(answer) === normalize(value))
  }
</script>
{% endblock %}
{% block content %}
<audio
  src="{{url_for('static', filename='success.wav')}}"
  id="success-audio"
></audio>
<audio
  src="{{url_for('static', filename='failure.wav')}}"
  id="failure-audio"
></audio>

<div class="quiz-shell">
  <div id="quiz">
    <button hx-post="/learn" hx-target="#quiz" hx-swap="innerHTML">
      Start
    </button>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block head %}
<script type="text/javascript">
  const play_success = () => {
    document.getElementById("success-audio").play()
  }
  const play_failure = () => {
    document.getElementById("failure-audio").play()
  }
  const play_pronounce = () => {
    document.getElementById("pronounce").play()
  }
  // Accept any of the pronunciations the dictionary lists, with or
  // without spaces between syllables, and with ü typed as v or u:.
  const check_pronunciation = (value) => {
    const answers = JSON.parse(
      document.getElementById("pronunciation-answers").textContent
    )
    const normalize = (pinyin) =>
      pinyin
        .trim()
        .toLowerCase()
        .replaceAll("u:", "v")
        .replaceAll("ü", "v")
        .replace(/\s+/g, "")
    return answers.some((answer) => normalize(answer) === normalize(value))
  }
</script>
{% endblock %}
{% block content %}
<audio
  src="{{url_for('static', filename='success.wav')}}"
  id="success-audio"
></audio>
<audio
  src="{{url_for('static', filename='failure.wav')}}"
  id="failure-audio"
></audio>

<div class="quiz-shell">
  <h1>Hanzi Friend</h1>
  <div id="quiz">
    <button hx-post="/learn" hx-target="#quiz" hx-swap="innerHTML">
      Start
    </button>
  </div>
</div>
{% endblock %}

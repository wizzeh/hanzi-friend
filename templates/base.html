<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Hanzi Friend{% endblock %}</title>
    <script src="{{url_for('static', filename='vendor/hyperscript.min.js')}}"></script>
    <script src="{{url_for('static', filename='vendor/htmx.min.js')}}"></script>
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='vendor/pico.min.css')}}"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='vendor/pico.colors.min.css')}}"
    />
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="container small">
      <nav aria-label="Main">
        <ul>
          <li>
            <a href="/" class="brand">
              <span class="logo-mark" aria-hidden="true">友</span>
              <strong>Hanzi Friend</strong>
            </a>
          </li>
        </ul>
        <ul>
          {% if session.get("user_id") %}
          <li><a href="/stats">Stats</a></li>
          <li><a href="/teach">Teach</a></li>
          <li><a href="/settings">Settings</a></li>
          <li>
            <form method="POST" action="/logout" class="logout-form">
              <button type="submit" class="secondary outline">
                Log out {{session.get("username")}}
              </button>
            </form>
          </li>
          {% endif %}
        </ul>
      </nav>
    </header>
    <main class="container small">{% block content %}{% endblock %}</main>
  </body>
</html>

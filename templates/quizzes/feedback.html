<div class="grid feedback" style="display: none">
  <button
    class="srs-again"
    hx-post="/review/{{card_id}}/again"
    hx-target="#quiz"
    hx-swap="innerHTML"
  >
    Again{% if intervals %} <small>{{intervals["again"]}}</small>{% endif %}
  </button>
  <button
    class="srs-hard"
    hx-post="/review/{{card_id}}/hard"
    hx-target="#quiz"
    hx-swap="innerHTML"
  >
    Hard{% if intervals %} <small>{{intervals["hard"]}}</small>{% endif %}
  </button>
  <button
    class="srs-good"
    hx-post="/review/{{card_id}}/good"
    hx-target="#quiz"
    hx-swap="innerHTML"
  >
    Good{% if intervals %} <small>{{intervals["good"]}}</small>{% endif %}
  </button>
  <button
    class="srs-easy"
    hx-post="/review/{{card_id}}/easy"
    hx-target="#quiz"
    hx-swap="innerHTML"
  >
    Easy{% if intervals %} <small>{{intervals["easy"]}}</small>{% endif %}
  </button>
  {% if translation %}
  <button class="srs-retest" hx-post="/learn" hx-target="#quiz" hx-swap="innerHTML">
    Retest
  </button>
  {% endif %}
</div>
